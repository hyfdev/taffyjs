name: Publish Core

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump inferred from Core commits unless overridden
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor

permissions:
  contents: read

concurrency:
  group: publish-core
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Core release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Core releases must be dispatched from main" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - name: Create release plan
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node tools/release/plan.ts --group core --bump "$RELEASE_BUMP" --output release-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Build ${{ matrix.settings.target }}
    needs: plan
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            args: ""
          - host: macos-latest
            target: aarch64-apple-darwin
            args: ""
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            args: --cross-compile
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            args: --use-napi-cross
          - host: windows-latest
            target: i686-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            args: --use-napi-cross
          - host: ubuntu-24.04
            target: aarch64-linux-android
            args: ""
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            args: --cross-compile
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: armv7-linux-androideabi
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: contains(matrix.settings.target, 'musl')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        if: contains(matrix.settings.target, 'musl')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      - name: Set up Node.js x86
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          architecture: x86
          package-manager-cache: false
      - name: Build native target
        shell: bash
        run: >-
          pnpm --filter @taffyjs/node exec napi build
          --manifest-path ../../crates/taffyjs_binding/Cargo.toml
          --package-json-path package.json
          --output-dir .
          --platform
          --js binding.js
          --dts binding.d.ts
          --esm
          --release
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.args }}
          -- --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-binding-${{ matrix.settings.target }}
          path: packages/taffyjs-node/taffyjs.*.node
          if-no-files-found: error
          retention-days: 7

  build-freebsd:
    name: Build x86_64-unknown-freebsd
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build native target in FreeBSD
        uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee # v1.3.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: "15.0"
          memory: 8G
          cpu_count: 3
          environment_variables: DEBUG RUSTUP_IO_THREADS
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm
            sudo npm install -g pnpm@11.20.0
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            pnpm install --frozen-lockfile
            pnpm --filter @taffyjs/node exec napi build --manifest-path ../../crates/taffyjs_binding/Cargo.toml --package-json-path package.json --output-dir . --platform --js binding.js --dts binding.d.ts --esm --release --target x86_64-unknown-freebsd -- --locked
            rm -rf node_modules
            rm -rf target
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-binding-x86_64-unknown-freebsd
          path: packages/taffyjs-node/taffyjs.freebsd-x64.node
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    name: Build Wasm package
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-wasip1
      - run: pnpm install --frozen-lockfile
      - name: Install the browser used by the Wasm runtime tests
        run: pnpm --filter tests-taffy-wasm exec playwright install --with-deps chromium
      - name: Build and test the Wasm packages
        run: pnpm exec vp run check:wasm
      - name: Smoke test @taffyjs/wasm with Bun 1.2
        run: pnpm dlx bun@1.2.0 packages/taffyjs-wasm/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/wasm with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual packages/taffyjs-wasm/tests/runtime-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-wasm-package
          path: packages/taffyjs-wasm/dist
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and test final tarballs
    needs: [plan, build-native, build-freebsd, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-release-plan
          path: release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: core-binding-*
          path: release-native
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-wasm-package
          path: packages/taffyjs-wasm/dist
      - name: Assemble release bundle
        run: node tools/release/assemble.ts --plan release-plan/release-plan.json --artifacts release-native --output release-bundle
      - name: Install and run final tarballs
        run: node tools/release/test-bundle.ts --bundle release-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified tarballs
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-release-bundle
          path: release-bundle
      - name: Publish npm packages and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.ts --bundle release-bundle --publish
