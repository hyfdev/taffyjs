name: Publish Yoga

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump inferred from Yoga commits unless overridden
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor

permissions:
  contents: read

concurrency:
  group: publish-yoga
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Yoga release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Yoga releases must be dispatched from main" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - name: Create release plan
        run: node tools/release/plan.ts --group yoga --bump "${{ inputs.bump }}" --output release-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yoga-release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Yoga packages
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taffyjs/yoga run build
      - run: pnpm --filter @taffyjs/yoga-wasm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yoga-native-package
          path: packages/taffyjs-yoga/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yoga-wasm-package
          path: packages/taffyjs-yoga-wasm/dist
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and test final tarballs
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - name: Install trusted-publishing npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yoga-release-plan
          path: release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yoga-native-package
          path: packages/taffyjs-yoga/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yoga-wasm-package
          path: packages/taffyjs-yoga-wasm/dist
      - name: Assemble release bundle
        run: node tools/release/assemble.ts --plan release-plan/release-plan.json --output release-bundle
      - name: Install and run final tarballs
        run: node tools/release/test-bundle.ts --bundle release-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yoga-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified tarballs
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@22.20.0
          cache: false
          install: false
      - name: Install trusted-publishing npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yoga-release-bundle
          path: release-bundle
      - name: Publish npm packages and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.ts --bundle release-bundle --publish
