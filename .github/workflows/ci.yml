name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-ubuntu-x64-gnu:
    name: Build and test Ubuntu x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.18.0
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build and run all tests
        run: pnpm exec vp run check:test
      - name: Smoke test @taffyjs/node with Bun 1.2
        run: pnpm dlx bun@1.2.0 packages/taffyjs-node/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/node with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual --allow-env --allow-read --allow-ffi packages/taffyjs-node/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/yoga with Bun 1.2
        run: pnpm dlx bun@1.2.0 tests/taffyjs-yoga/runtime-smoke.mjs
      - name: Smoke test @taffyjs/yoga with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual --allow-env --allow-read --allow-ffi tests/taffyjs-yoga/runtime-smoke.mjs
      - name: Verify committed package outputs are current
        run: git diff --exit-code -- packages/taffyjs-node/index.js packages/taffyjs-node/index.d.ts packages/taffyjs-node/binding.js packages/taffyjs-node/binding.d.ts

  test-windows-x64-msvc:
    name: Build and test Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.18.0
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build and run all tests
        run: pnpm exec vp run check:test
      - name: Smoke test @taffyjs/node with Bun 1.2
        run: pnpm dlx bun@1.2.0 packages/taffyjs-node/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/node with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual --allow-env --allow-read --allow-ffi packages/taffyjs-node/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/yoga with Bun 1.2
        run: pnpm dlx bun@1.2.0 tests/taffyjs-yoga/runtime-smoke.mjs
      - name: Smoke test @taffyjs/yoga with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual --allow-env --allow-read --allow-ffi tests/taffyjs-yoga/runtime-smoke.mjs

  build-native-targets:
    name: Build ${{ matrix.settings.target }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            args: ""
          - host: macos-latest
            target: aarch64-apple-darwin
            args: ""
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            args: --cross-compile
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            args: --use-napi-cross
          - host: windows-latest
            target: i686-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            args: --use-napi-cross
          - host: ubuntu-24.04
            target: aarch64-linux-android
            args: ""
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            args: --cross-compile
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            args: ""
          - host: ubuntu-24.04
            target: armv7-linux-androideabi
            args: ""
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.18.0
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.settings.target, 'musl')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: contains(matrix.settings.target, 'musl')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      - name: Set up Node.js x86
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          architecture: x86
      - name: Build native target
        shell: bash
        run: >-
          pnpm --filter @taffyjs/node exec napi build
          --manifest-path ../../crates/taffyjs_binding/Cargo.toml
          --package-json-path package.json
          --output-dir .
          --platform
          --js binding.js
          --dts binding.d.ts
          --esm
          --release
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.args }}
          -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/taffyjs-node/taffyjs.*.node
          if-no-files-found: error

  build-freebsd-x64:
    name: Build x86_64-unknown-freebsd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build native target in FreeBSD
        uses: cross-platform-actions/action@v1.3.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: "15.0"
          memory: 8G
          cpu_count: 3
          environment_variables: DEBUG RUSTUP_IO_THREADS
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm
            sudo npm install -g pnpm@11.20.0
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            pnpm install --frozen-lockfile
            pnpm --filter @taffyjs/node exec napi build --manifest-path ../../crates/taffyjs_binding/Cargo.toml --package-json-path package.json --output-dir . --platform --js binding.js --dts binding.d.ts --esm --release --target x86_64-unknown-freebsd -- --locked
            rm -rf node_modules
            rm -rf target
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-x86_64-unknown-freebsd
          path: packages/taffyjs-node/taffyjs.freebsd-x64.node
          if-no-files-found: error

  test-wasm:
    name: Build and test WASIP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.18.0
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: pnpm install --frozen-lockfile
      - name: Install the browser used by the Wasm runtime test
        run: pnpm --filter tests-taffy-wasm exec playwright install --with-deps chromium
      - name: Build and test the Wasm package
        run: pnpm exec vp run check:wasm
      - name: Smoke test @taffyjs/wasm with Bun 1.2
        run: pnpm dlx bun@1.2.0 packages/taffyjs-wasm/tests/runtime-smoke.mjs
      - name: Smoke test @taffyjs/wasm with Deno 2.2
        run: pnpm dlx deno@2.2.0 run --node-modules-dir=manual packages/taffyjs-wasm/tests/runtime-smoke.mjs

  check-node:
    name: Node checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec vp run check:format
      - name: Check JavaScript and TypeScript
        run: pnpm exec vp run check:lint
      - name: Verify native platform metadata
        run: pnpm exec vp run check:platforms
      - name: Verify generated sources are committed
        run: pnpm exec vp run check:codegen

  check-rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
